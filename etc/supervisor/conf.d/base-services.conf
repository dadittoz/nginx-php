[program:php7-fpm]
environment=PHP_INI_SCAN_DIR=:/data/config/php-conf.d
command=php-fpm${PHP_VERSION} --force-stderr --fpm-config /etc/php/${PHP_VERSION}/fpm/php-fpm.conf
; graceful: finish running requests before exiting (pod stop, config-watcher restarts)
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx
; graceful: finish open requests/keepalives before exiting
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=cron -f
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:configs]
; reload instead of restart: nginx HUP and php-fpm USR2 re-read their config (php-fpm also its .ini files) and
; replace workers without dropping requests. A full restart cost 1-7 s of errors per config change.
command=bash -c "while inotifywait --recursive -e create,delete,modify,move -q /data/config/; do sleep 1; supervisorctl reread; supervisorctl update; bash /config/copy-cron-config; if nginx -t -q; then supervisorctl signal HUP nginx; else echo \"nginx config test failed, not reloading\"; fi; supervisorctl signal USR2 php7-fpm; done"
