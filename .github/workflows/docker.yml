# Build this branch's image and push it to Docker Hub.
# Branch -> tag: php7.2-bookworm -> dadittoz/nginx-php:v7.2-bookworm (base)
#                site-o-bookworm -> dadittoz/nginx-php:site-o-bookworm (FROM the base + ionCube)
# Every build also gets an immutable tag <tag>-<yyyymmdd>-<short sha> to pin in deployments.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token, Read & Write).
# site-o-bookworm builds FROM the base on Docker Hub: build php7.2-bookworm first.
name: docker
on:
  push:
    branches: [php7.2-bookworm, site-o-bookworm]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image tag for this branch
        id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            php7.2-bookworm) t=v7.2-bookworm ;;
            site-o-bookworm) t=site-o-bookworm ;;
            *) echo "no image tag for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "pin=$t-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            dadittoz/nginx-php:${{ steps.tag.outputs.tag }}
            dadittoz/nginx-php:${{ steps.tag.outputs.pin }}
